name: validate-dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build React dashboard
        run: npm ci && npm run build
      - name: Prepare Vercel deployment bundle
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle/src
          cp -R dist/. deploy-bundle/
          cp -R api backend data deploy-bundle/
          cp -R src/content deploy-bundle/src/
          cp requirements.txt deploy-bundle/
          cat > deploy-bundle/vercel.json <<'EOF'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "functions": {
              "api/index.py": {
                "includeFiles": "{backend,data,src/content}/**",
                "maxDuration": 10
              }
            },
            "headers": [
              {
                "source": "/api",
                "headers": [
                  {"key": "Cache-Control", "value": "no-store"},
                  {"key": "X-Content-Type-Options", "value": "nosniff"}
                ]
              },
              {
                "source": "/(.*)",
                "headers": [
                  {"key": "X-Content-Type-Options", "value": "nosniff"},
                  {"key": "Referrer-Policy", "value": "same-origin"}
                ]
              }
            ]
          }
          EOF
      - name: Upload Vercel deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: seplanbi-vercel-bundle
          path: deploy-bundle/
          retention-days: 1
      - name: Validate privacy and data minimization
        run: python scripts/check_data_privacy.py
      - name: Validate dataset and indicators
        run: python scripts/validate.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
