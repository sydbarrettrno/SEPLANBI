name: validate-dashboard

on:
  push:
    branches: [main, feat/ui-system-v01]
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Build React dashboard
        run: npm run build
      - name: Validate privacy and data minimization
        run: python scripts/check_data_privacy.py
      - name: Validate dataset and indicators
        run: python scripts/validate.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
